[project]
name = "it_pkg"
description = "A project built by the plugin's integration tests"
requires-python = ">=3.9"
dynamic = ["version"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

# The wheel leaves out a data file the code needs: testing the wheel must catch it.
[tool.hatch.build.targets.wheel]
exclude = ["src/it_pkg/greeting.txt"]
