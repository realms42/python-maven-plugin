[project.optional-dependencies]
test = ["pytest", "pytest-cov", "ruff"]
build = ["build"]

[dependency-groups]
test = ["pytest", "pytest-cov", "ruff"]
build = ["build"]

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["tests"]
