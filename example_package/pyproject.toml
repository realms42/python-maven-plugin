[project]
name = "example_package"
description = "Example package built by the python-maven-plugin"
requires-python = ">=3.9"
dynamic = ["version"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "env"
variable = "PACKAGE_VERSION"

[tool.ruff]
line-length = 100
