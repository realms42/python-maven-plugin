[project]
name = "example_package"
description = "Example package built by the python-maven-plugin"
requires-python = ">=3.9"
dynamic = ["version"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"
# Only needed because this example is in a subdirectory of its git repository.
raw-options = { search_parent_directories = true }

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.ruff]
line-length = 100
