[project]
name = "example-package"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "realms42", email = "61291886+realms42@users.noreply.github.com" }
]
requires-python = ">=3.6"
dependencies = []

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>[0-9]+(?:\\.[0-9]+)*(?:[a-zA-Z0-9\\.\\-+]*)?)"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["tests"]
