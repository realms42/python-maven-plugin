# https://taskfile.dev

version: '3'

vars:
  PLUGIN_DIR: python-maven-plugin
  PARENT_DIR: example_parent
  EXAMPLE_DIR: example_package
  RPM_DIR: example_rpm
  CONTAINER_DIR: example_container
  MVN: mvn -B
  IMAGE: python-maven-plugin:latest

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build, test (unit and integration) and install the plugin into the local Maven repo
    dir: '{{.PLUGIN_DIR}}'
    run: once
    cmds:
      - '{{.MVN}} install'

  test:
    desc: Run the plugin's unit tests
    dir: '{{.PLUGIN_DIR}}'
    cmds:
      - '{{.MVN}} test'

  verify:
    desc: Run the full plugin verification (unit and integration tests)
    dir: '{{.PLUGIN_DIR}}'
    cmds:
      - '{{.MVN}} verify'

  it:
    desc: Run the plugin's integration tests (one with `task it -- -Dinvoker.test=lint-violation`)
    dir: '{{.PLUGIN_DIR}}'
    cmds:
      - '{{.MVN}} verify -DskipTests {{.CLI_ARGS}}'

  offline:
    desc: Resolve and cache all plugin dependencies for offline use
    dir: '{{.PLUGIN_DIR}}'
    cmds:
      - '{{.MVN}} dependency:go-offline'

  parent:
    desc: Install the example parent POM
    deps: [build]
    dir: '{{.PARENT_DIR}}'
    run: once
    cmds:
      - '{{.MVN}} install'

  example:
    desc: Build and install the example package, which inherits the installed parent
    deps: [parent]
    dir: '{{.EXAMPLE_DIR}}'
    run: once
    cmds:
      - '{{.MVN}} install'

  rpm:
    desc: Build the RPM from the installed example wheel (another version with `task rpm -- -Dexample.package.version=…`)
    deps: [example]
    dir: '{{.RPM_DIR}}'
    cmds:
      - '{{.MVN}} install {{.CLI_ARGS}}'

  container:
    desc: Build a container image with the installed example wheel in a venv (needs docker)
    deps: [example]
    dir: '{{.CONTAINER_DIR}}'
    cmds:
      - '{{.MVN}} install {{.CLI_ARGS}}'

  lint:
    desc: Lint the example package via the plugin's lint goal
    deps: [parent]
    dir: '{{.EXAMPLE_DIR}}'
    cmds:
      - '{{.MVN}} io.github.realms42:python-maven-plugin:lint'

  format:
    desc: Check the example package's formatting via the plugin's format goal
    deps: [parent]
    dir: '{{.EXAMPLE_DIR}}'
    cmds:
      - '{{.MVN}} io.github.realms42:python-maven-plugin:format'

  docker:
    desc: Build the Docker image (plugin, parent and example package, without tests)
    cmds:
      - docker build -t {{.IMAGE}} .

  clean:
    desc: Clean the build output of the plugin and every example
    cmds:
      - '{{.MVN}} -f {{.PLUGIN_DIR}}/pom.xml clean'
      - '{{.MVN}} -f {{.PARENT_DIR}}/pom.xml clean'
      - '{{.MVN}} -f {{.EXAMPLE_DIR}}/pom.xml clean'
      - '{{.MVN}} -f {{.RPM_DIR}}/pom.xml clean'
      - '{{.MVN}} -f {{.CONTAINER_DIR}}/pom.xml clean'

  all:
    desc: Build the plugin and the example package end to end
    cmds:
      - task: build
      - task: example
