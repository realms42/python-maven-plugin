name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # One `task` command, so the plugin is built, unit tested and integration tested once, then the example is
      # built with it. Separate `task build` and `task example` steps would build the plugin twice.
      - name: Build and test the plugin, then build the example package
        run: task all
